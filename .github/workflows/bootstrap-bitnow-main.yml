name: Integrate and Build BitNow

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/bootstrap-bitnow-main.yml' ]

permissions:
  contents: write

env:
  TARGET_BRANCH: bitnow/upstream-full-rebrand

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BitNow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Wire BitNow into upstream transport and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Patch anchor missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # MainActivity: BitNow is the primary app shell after transport onboarding.
          patch(
              'app/src/main/java/com/bitchat/android/MainActivity.kt',
              'import com.bitchat.android.ui.ChatScreen\n',
              'import com.bitchat.android.bitnow.BitNowProfileSetupScreen\nimport com.bitchat.android.bitnow.BitNowProfileStore\nimport com.bitchat.android.bitnow.BitNowRootScreen\n'
          )
          patch(
              'app/src/main/java/com/bitchat/android/MainActivity.kt',
              '                ChatScreen(viewModel = chatViewModel)\n',
              '''                val bitNowContext = LocalContext.current\n                var bitNowProfileReady by remember {\n                    mutableStateOf(BitNowProfileStore.load(bitNowContext) != null)\n                }\n                if (bitNowProfileReady) {\n                    BitNowRootScreen(viewModel = chatViewModel)\n                } else {\n                    BitNowProfileSetupScreen { profile ->\n                        chatViewModel.saveBitNowProfile(profile)\n                        bitNowProfileReady = true\n                    }\n                }\n'''
          )

          # MessageHandler: consume BitNow controls inside the already authenticated Noise PM path.
          patch(
              'app/src/main/java/com/bitchat/android/mesh/MessageHandler.kt',
              'import com.bitchat.android.favorites.FavoriteControlMessage\n',
              'import com.bitchat.android.favorites.FavoriteControlMessage\nimport com.bitchat.android.bitnow.BitNowControlMessage\nimport com.bitchat.android.bitnow.BitNowRegistry\nimport com.bitchat.android.bitnow.BitNowRelationshipStore\n'
          )
          patch(
              'app/src/main/java/com/bitchat/android/mesh/MessageHandler.kt',
              '''                        // Handle favorite/unfavorite notifications embedded as PMs\n                        val pmContent = privateMessage.content\n                        if (FavoriteControlMessage.parse(pmContent) != null) {\n''',
              '''                        // BitNow metadata rides inside the existing authenticated/encrypted\n                        // private-message transport. It never becomes a visible chat message.\n                        val pmContent = privateMessage.content\n                        when (val bitNow = BitNowControlMessage.parse(pmContent)) {\n                            is BitNowControlMessage.Profile -> {\n                                if (bitNow.profile.visible) BitNowRegistry.update(peerID, bitNow.profile)\n                                else BitNowRegistry.remove(peerID)\n                                sendDeliveryAck(privateMessage.messageID, peerID)\n                                return true\n                            }\n                            is BitNowControlMessage.Interest -> {\n                                BitNowRelationshipStore.setTheirs(peerID, bitNow.interested)\n                                sendDeliveryAck(privateMessage.messageID, peerID)\n                                return true\n                            }\n                            null -> Unit\n                        }\n\n                        // Handle favorite/unfavorite notifications embedded as PMs\n                        if (FavoriteControlMessage.parse(pmContent) != null) {\n'''
          )

          # MessageRouter: reuse mesh/Nostr routing, Noise session readiness, queue and retries.
          patch(
              'app/src/main/java/com/bitchat/android/services/MessageRouter.kt',
              'import com.bitchat.android.favorites.FavoriteControlMessage\n',
              'import com.bitchat.android.favorites.FavoriteControlMessage\nimport com.bitchat.android.bitnow.BitNowControlMessage\nimport com.bitchat.android.bitnow.BitNowProfile\n'
          )
          patch(
              'app/src/main/java/com/bitchat/android/services/MessageRouter.kt',
              '''    // Flush any queued messages for a specific peerID.\n''',
              '''    fun sendBitNowProfile(toPeerID: String, profile: BitNowProfile): RouteResult =\n        sendPrivate(\n            content = BitNowControlMessage.encodeProfile(profile),\n            toPeerID = toPeerID,\n            recipientNickname = "BitNow",\n            messageID = java.util.UUID.randomUUID().toString().uppercase()\n        )\n\n    fun sendBitNowInterest(toPeerID: String, interested: Boolean): RouteResult =\n        sendPrivate(\n            content = BitNowControlMessage.encodeInterest(interested),\n            toPeerID = toPeerID,\n            recipientNickname = "BitNow",\n            messageID = java.util.UUID.randomUUID().toString().uppercase()\n        )\n\n    // Flush any queued messages for a specific peerID.\n'''
          )

          # ChatViewModel: expose BitNow state, persist profile/interest, and share profile on connection.
          patch(
              'app/src/main/java/com/bitchat/android/ui/ChatViewModel.kt',
              'import com.bitchat.android.features.voice.VoiceRecorder\n',
              '''import com.bitchat.android.features.voice.VoiceRecorder\nimport com.bitchat.android.bitnow.BitNowProfile\nimport com.bitchat.android.bitnow.BitNowProfileStore\nimport com.bitchat.android.bitnow.BitNowRegistry\nimport com.bitchat.android.bitnow.BitNowRelationshipStore\nimport com.bitchat.android.services.MessageRouter\n'''
          )
          patch(
              'app/src/main/java/com/bitchat/android/ui/ChatViewModel.kt',
              '    val peerDirect: StateFlow<Map<String, Boolean>> = state.peerDirect\n',
              '''    val peerDirect: StateFlow<Map<String, Boolean>> = state.peerDirect\n    val bitNowProfiles = BitNowRegistry.profiles\n    val bitNowMyInterests = BitNowRelationshipStore.myInterests\n    val bitNowTheirInterests = BitNowRelationshipStore.theirInterests\n'''
          )
          patch(
              'app/src/main/java/com/bitchat/android/ui/ChatViewModel.kt',
              '''        ContactDirectory.initialize(getApplication()) { mesh }\n''',
              '''        ContactDirectory.initialize(getApplication()) { mesh }\n        BitNowRelationshipStore.initialize(getApplication())\n        viewModelScope.launch {\n            var sharedWith = emptySet<String>()\n            state.connectedPeers.collect { peers ->\n                val active = peers.filter { it != mesh.myPeerID }.toSet()\n                BitNowRegistry.retain(active)\n                sharedWith = sharedWith intersect active\n                val localProfile = BitNowProfileStore.load(getApplication())\n                if (localProfile != null && localProfile.visible) {\n                    (active - sharedWith).forEach { peerID ->\n                        runCatching {\n                            MessageRouter.getInstance(getApplication(), mesh)\n                                .sendBitNowProfile(peerID, localProfile)\n                        }\n                    }\n                    sharedWith = sharedWith + active\n                }\n            }\n        }\n'''
          )
          patch(
              'app/src/main/java/com/bitchat/android/ui/ChatViewModel.kt',
              '    fun setNickname(newNickname: String) {\n',
              '''    fun saveBitNowProfile(profile: BitNowProfile) {\n        BitNowProfileStore.save(getApplication(), profile)\n        connectedPeers.value\n            .filter { it != mesh.myPeerID }\n            .forEach { peerID ->\n                runCatching {\n                    MessageRouter.getInstance(getApplication(), mesh)\n                        .sendBitNowProfile(peerID, profile)\n                }\n            }\n    }\n\n    fun setBitNowInterest(peerID: String, interested: Boolean) {\n        BitNowRelationshipStore.setMine(getApplication(), peerID, interested)\n        runCatching {\n            MessageRouter.getInstance(getApplication(), mesh)\n                .sendBitNowInterest(peerID, interested)\n        }\n    }\n\n    fun openBitNowChat(peerID: String) {\n        showPrivateChatSheet(peerID)\n    }\n\n    fun setNickname(newNickname: String) {\n'''
          )

          # Unit tests for the BitNow profile/control contract.
          test = Path('app/src/test/kotlin/com/bitchat/android/bitnow/BitNowProfileCodecTest.kt')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''package com.bitchat.android.bitnow\n\nimport org.junit.Assert.*\nimport org.junit.Test\n\nclass BitNowProfileCodecTest {\n    @Test fun profileJsonRoundTrips() {\n        val input = BitNowProfile("Alex", 29, "Coffee?", "Meet now", true)\n        assertEquals(input, BitNowProfileCodec.decode(BitNowProfileCodec.encode(input)))\n    }\n\n    @Test(expected = IllegalArgumentException::class)\n    fun rejectsUnder18Profiles() {\n        BitNowProfile("Nope", 17)\n    }\n}\n''')
          PY

      - name: Commit integrated product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "feat(bitnow): wire encrypted nearby profiles, interests and primary UI"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitnow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
