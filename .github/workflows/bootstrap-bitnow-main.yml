name: Build Final BitNow APK

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/bootstrap-bitnow-main.yml' ]

permissions:
  contents: read

env:
  TARGET_BRANCH: bitnow/upstream-full-rebrand

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest BitNow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload BitNow APK
        uses: actions/upload-artifact@v4
        with:
          name: bitnow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests separately
        continue-on-error: true
        run: ./gradlew test --no-daemon
